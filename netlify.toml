[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/podcast-rss"
  to = "https://anchor.fm/s/e6cb6024/podcast/rss"
  status = 200
  force = true

[[redirects]]
  from = "/api/claim-discount"
  to = "/.netlify/functions/claim-discount"
  status = 200
  force = true

[[redirects]]
from = "/api/booking-portal"
to = "/.netlify/functions/booking-portal"
status = 200
force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://*.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://tracker.metricool.com https://*.metricool.com https://*.sanity.io https://design-system-static.sanity.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.sanity.io https://design-system-static.sanity.io; font-src 'self' https://fonts.gstatic.com https://*.sanity.io https://design-system-static.sanity.io data:; img-src 'self' data: https: blob: https://*.sanity.io https://cdn.sanity.io; media-src 'self' https: blob:; connect-src 'self' https://*.sanity.io https://*.sanity.studio https://*.sanity.work https://*.api.sanity.io wss://*.sanity.io wss://*.api.sanity.io https://design-system-static.sanity.io https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com https://*.googletagmanager.com https://tracker.metricool.com https://*.metricool.com https://anchor.fm https://*.anchor.fm https://*.spotify.com https://api.rss2json.com https://feeds.buzzsprout.com https://raw.githubusercontent.com https://api.allorigins.win https://corsproxy.io https://boards-api.greenhouse.io https://api.lever.co https://api.ashbyhq.com https://remoteok.com https://remotive.com https://www.arbeitnow.com; frame-src 'self' https://open.spotify.com https://*.spotify.com https://www.youtube.com https://www.youtube-nocookie.com https://lu.ma https://*.lu.ma https://luma.com https://*.luma.com https://*.sanity.io https://*.sanity.studio; object-src 'none'; base-uri 'self'; form-action 'self' https:; upgrade-insecure-requests;"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache the HTML shell or the service worker itself so that fresh asset
# references and the self-unregistering cleanup worker are always retrieved.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=86400"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=86400"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    Pragma = "no-cache"
    Expires = "0"

